services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  solr:
    image: solr:9
    restart: unless-stopped
    ports:
      - "8983:8983"
    command:
      - solr-precreate
      - problems
    volumes:
      - solr_data:/var/solr

  server:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/dsaflow
      JWT_SECRET: docker-dev-secret
      REDIS_URL: redis://redis:6379
      SOLR_URL: http://solr:8983/solr/problems
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - mongo
      - redis
      - solr

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongo_data:
  solr_data:
